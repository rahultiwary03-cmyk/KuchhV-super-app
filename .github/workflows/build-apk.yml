name: Build KuchhV APK

on:
  push:
    branches: ["main"]
    paths:
      - "kuchhv_mobile_app/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "kuchhv_mobile_app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        working-directory: ./kuchhv_mobile_app
        run: flutter create --platforms=android .

      - name: Configure speech-recognition permissions
        working-directory: ./kuchhv_mobile_app
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)
          tree = ET.parse(manifest_path)
          root = tree.getroot()
          name_attribute = f"{{{android_ns}}}name"

          queries = root.find("queries")
          application = root.find("application")

          for permission_name in (
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
          ):
              if not any(
                  permission.get(name_attribute) == permission_name
                  for permission in root.findall("uses-permission")
              ):
                  anchor = queries if queries is not None else application
                  position = list(root).index(anchor) if anchor is not None else len(root)
                  root.insert(
                      position,
                      ET.Element("uses-permission", {name_attribute: permission_name}),
                  )

          if queries is None:
              queries = ET.Element("queries")
              application = root.find("application")
              position = list(root).index(application) if application is not None else len(root)
              root.insert(position, queries)

          for action_name in (
              "android.speech.RecognitionService",
              "android.intent.action.TTS_SERVICE",
          ):
              if not any(
                  action.get(name_attribute) == action_name
                  for action in queries.findall("./intent/action")
              ):
                  intent = ET.SubElement(queries, "intent")
                  ET.SubElement(
                      intent,
                      "action",
                      {name_attribute: action_name},
                  )

          ET.indent(tree, space="    ")
          tree.write(manifest_path, encoding="utf-8", xml_declaration=True)
          permissions = {
              permission.get(name_attribute)
              for permission in root.findall("uses-permission")
          }
          if "android.permission.INTERNET" not in permissions:
              raise SystemExit("Android manifest is missing INTERNET permission")
          PY

      - name: Install native voice channels
        working-directory: ./kuchhv_mobile_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          template_path = Path("tool/MainActivity.kt.template")
          activity_candidates = list(Path("android/app/src/main/kotlin").rglob("MainActivity.kt"))
          if len(activity_candidates) != 1:
              raise SystemExit(
                  f"Expected one generated MainActivity.kt, found {len(activity_candidates)}"
              )

          activity_path = activity_candidates[0]
          activity_source = activity_path.read_text(encoding="utf-8")
          package_match = re.search(r"^package\s+([\w.]+)", activity_source, re.MULTILINE)
          if package_match is None:
              raise SystemExit(f"Cannot determine Android package from {activity_path}")

          template = template_path.read_text(encoding="utf-8")
          template = re.sub(
              r"^package\s+[\w.]+",
              f"package {package_match.group(1)}",
              template,
              count=1,
              flags=re.MULTILINE,
          )
          activity_path.write_text(template, encoding="utf-8")

          gradle_properties = Path("android/gradle.properties")
          properties = gradle_properties.read_text(encoding="utf-8")
          properties = re.sub(
              r"(?m)^android\.newDsl=.*\n?",
              "",
              properties,
          )
          gradle_properties.write_text(
              properties.rstrip() + "\nandroid.newDsl=false\n",
              encoding="utf-8",
          )
          PY

      - name: Install Flutter dependencies
        working-directory: ./kuchhv_mobile_app
        run: flutter pub get

      - name: Run flutter test || trues
        working-directory: ./kuchhv_mobile_app
        run: flutter test || true

      - name: Build release APK
        working-directory: ./kuchhv_mobile_app
        run: >-
          flutter build apk --release
          --dart-define=API_BASE_URL=https://kuchhv-super-app-production.up.railway.app

      - name: Build Play Store app bundle
        working-directory: ./kuchhv_mobile_app
        run: >-
          flutter build appbundle --release
          --dart-define=API_BASE_URL=https://kuchhv-super-app-production.up.railway.app

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: KuchhV-Release-APK
          path: kuchhv_mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Play Store app bundle
        uses: actions/upload-artifact@v4
        with:
          name: KuchhV-Play-Store-AAB
          path: kuchhv_mobile_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
